name: Build Thunder on Linux

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["R5_3"]
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - 'ReleaseNotes/**'
  pull_request:
    branches: ["R5_3"]
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - 'ReleaseNotes/**'

jobs:
  Thunder:
    uses: ./.github/workflows/Linux build template.yml
    with:
      thunder_ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
