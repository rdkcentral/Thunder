name: Build Thunder on Linux

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - 'ReleaseNotes/**'
  pull_request:
    branches: ["master"]
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - 'ReleaseNotes/**'

jobs:
  Thunder:
    uses: ./.github/workflows/Linux build template.yml

  Test:
    needs: Thunder
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        build_type: [Debug, Release, MinSizeRel]
        shared_libs: [ON, OFF]

    env:
      lib: LD_LIBRARY_PATH=${{github.workspace}}/${{matrix.build_type}}/install/usr/lib:$LD_LIBRARY_PATH
      path: PATH=${{github.workspace}}/${{matrix.build_type}}/install/usr/bin:$PATH

    name: Test - ${{matrix.shared_libs == 'OFF' && 'Static ' || ''}}${{matrix.build_type}}
    steps:
    - name: Install system dependencies
      uses: rdkcentral/ThunderTools/.github/actions/apt-dependencies@development/actions-stuck-updating

    - name: Download Thunder artifact
      uses: actions/download-artifact@v4
      with:
        name: Thunder-${{matrix.build_type}}${{matrix.shared_libs == 'OFF' && '-static' || ''}}-test-artifact
        path: ${{matrix.build_type}}

    - name: Unpack files
      run: |
        tar -xvzf ${{matrix.build_type}}/${{matrix.build_type}}.tar.gz
        rm ${{matrix.build_type}}/${{matrix.build_type}}.tar.gz

    - name: Run IPTestAdministrator unit tests
      run: ${{env.path}} ${{env.lib}} Thunder_test_tests

    - name: Run core unit tests
      run: ${{env.path}} ${{env.lib}} Thunder_test_core

    - name: Run test framework smoke test
      run: ${{env.path}} ${{env.lib}} thunder_test_runtime_smoke

  ThunderInterfaces:
    needs: Thunder
    uses: rdkcentral/ThunderInterfaces/.github/workflows/Linux build template.yml@master

  ThunderExtensions:
    needs: Thunder
    uses: rdkcentral/ThunderExtensions/.github/workflows/Linux build template.yml@main

  ThunderLibraries:
    needs: Thunder
    uses: WebPlatformForEmbedded/ThunderLibraries/.github/workflows/Linux build template.yml@main

  ThunderClientLibraries:
    needs: ThunderInterfaces
    uses: rdkcentral/ThunderClientLibraries/.github/workflows/Linux build template.yml@master

  ThunderNanoServices:
    needs: ThunderInterfaces
    uses: rdkcentral/ThunderNanoServices/.github/workflows/Linux build template.yml@master

  ThunderNanoServicesRDK:
    needs: ThunderInterfaces
    uses: WebPlatformForEmbedded/ThunderNanoServicesRDK/.github/workflows/Linux build template.yml@master
