name: Build Thunder on Linux

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: ["master", "development/ci-plugin-unload-check"]
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - 'ReleaseNotes/**'
  pull_request:
    branches: ["master"]
    paths-ignore:
      - 'doc/**'
      - 'docs/**'
      - 'ReleaseNotes/**'

jobs:
  Thunder:
    uses: ./.github/workflows/Linux build template.yml

  Test:
    needs: Thunder
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        build_type: [Debug, Release, MinSizeRel]
        shared_libs: [ON, OFF]

    env:
      lib: LD_LIBRARY_PATH=${{github.workspace}}/${{matrix.build_type}}/install/usr/lib:$LD_LIBRARY_PATH
      path: PATH=${{github.workspace}}/${{matrix.build_type}}/install/usr/bin:$PATH

    name: Test - ${{matrix.shared_libs == 'OFF' && 'Static ' || ''}}${{matrix.build_type}}
    steps:
    - name: Install system dependencies
      shell: bash
      run: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        for attempt in {1..5}; do
          if sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30; then
            break
          fi
          echo "apt-get update failed (attempt $attempt), retrying..."
          sleep $((attempt*10))
        done
        for attempt in {1..4}; do
          if sudo apt-get install -y --no-install-recommends libusb-1.0-0 zlib1g libssl3; then
            break
          fi
          sudo apt-get clean
          sleep $((attempt*15))
        done

    - name: Download Thunder artifact
      uses: actions/download-artifact@v4
      with:
        name: Thunder-${{matrix.build_type}}${{matrix.shared_libs == 'OFF' && '-static' || ''}}-test-artifact
        path: ${{matrix.build_type}}

    - name: Unpack files
      run: |
        tar -xvzf ${{matrix.build_type}}/${{matrix.build_type}}.tar.gz
        rm ${{matrix.build_type}}/${{matrix.build_type}}.tar.gz

    - name: Run IPTestAdministrator unit tests
      run: ${{env.path}} ${{env.lib}} Thunder_test_tests

    - name: Run core unit tests
      run: ${{env.path}} ${{env.lib}} Thunder_test_core

    - name: Run test framework smoke test
      run: ${{env.path}} ${{env.lib}} thunder_test_runtime_smoke

  ThunderInterfaces:
    needs: Thunder
    uses: rdkcentral/ThunderInterfaces/.github/workflows/Linux build template.yml@master

  ThunderLibraries:
    needs: Thunder
    uses: WebPlatformForEmbedded/ThunderLibraries/.github/workflows/Linux build template.yml@main

  ThunderClientLibraries:
    needs: ThunderInterfaces
    uses: rdkcentral/ThunderClientLibraries/.github/workflows/Linux build template.yml@master

  ThunderNanoServices:
    needs: ThunderInterfaces
    uses: rdkcentral/ThunderNanoServices/.github/workflows/Linux build template.yml@master

  ThunderNanoServicesRDK:
    needs: ThunderInterfaces
    uses: WebPlatformForEmbedded/ThunderNanoServicesRDK/.github/workflows/Linux build template.yml@master

  ThunderRun:
    needs: [ThunderClientLibraries, ThunderNanoServices, ThunderNanoServicesRDK]
    runs-on: ubuntu-24.04
    name: Plugin unload check

    steps:
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libusb-1.0-0 zlib1g libssl3 unzip tree openssl

    - name: Download plugin artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: '*-Release-artifact'
        path: artifacts
    
    - name: Show artifacts
      run: tree artifacts

    - name: Unpack
      run: |
        mkdir -p runtime
        for f in artifacts/*/*.tar.gz; do
          echo "unpacking $f"
          tar -xzf "$f" -C runtime \
            --exclude='*/include/*' \
            --exclude='*/include' \
            --exclude='*.a' \
            --exclude='*/cmake/*' \
            --exclude='*/pkgconfig/*'
        done
        find runtime -name '*.so*' -path '*plugin*' | head -20

    - name: Show what we got
      run: |
        tree ./runtime
        find ./runtime -name 'config.json' -o -name '*.so' -path '*plugin*' | head -40